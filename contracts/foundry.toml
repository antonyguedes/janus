[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10_000
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "../testdata" }, { access = "read-write", path = "../deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 110
