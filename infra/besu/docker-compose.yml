# Rede Besu QBFT local: 4 validadores, gas zero, allowlist de contas.
# O allowlist é copiado por nó em data/nodeN (o Besu precisa de escrita no arquivo).
# RPC exposto apenas pelo node1 (http://localhost:8545, ws://localhost:8546).
x-besu: &besu
  image: ${BESU_IMAGE:-hyperledger/besu:26.11.0}
  user: "${UID:-1000}:${GID:-1000}"
  restart: unless-stopped
  volumes:
    - ./data:/data
  entrypoint: ["/bin/bash", "-c"]

x-flags: &flags >-
  --genesis-file=/data/genesis.json
  --min-gas-price=0
  --tx-pool-min-gas-price=0
  --permissions-accounts-config-file-enabled
    --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-cors-origins=*
  --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL,DEBUG
  --rpc-ws-enabled --rpc-ws-host=0.0.0.0 --rpc-ws-api=ETH,NET,WEB3,QBFT
  --host-allowlist=* --p2p-port=30303 --profile=ENTERPRISE
  --logging=INFO

services:
  besu-node1:
    <<: *besu
    command:
      - |
        exec besu --data-path=/data/node1 --node-private-key-file=/data/node1/key --permissions-accounts-config-file=/data/node1/permissions_config.toml $$FLAGS
    environment: { FLAGS: *flags }
    ports: ["8545:8545", "8546:8546"]
    networks: { besu: { ipv4_address: 172.30.0.11 } }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8545'"]
      interval: 3s
      retries: 40

  besu-node2: &peer
    <<: *besu
    command:
      - |
        exec besu --data-path=/data/node2 --node-private-key-file=/data/node2/key --permissions-accounts-config-file=/data/node2/permissions_config.toml --bootnodes=$$(cat /data/bootnode) $$FLAGS
    environment: { FLAGS: *flags }
    networks: { besu: { ipv4_address: 172.30.0.12 } }
    depends_on: [besu-node1]

  besu-node3:
    <<: *peer
    command:
      - |
        exec besu --data-path=/data/node3 --node-private-key-file=/data/node3/key --permissions-accounts-config-file=/data/node3/permissions_config.toml --bootnodes=$$(cat /data/bootnode) $$FLAGS
    networks: { besu: { ipv4_address: 172.30.0.13 } }

  besu-node4:
    <<: *peer
    command:
      - |
        exec besu --data-path=/data/node4 --node-private-key-file=/data/node4/key --permissions-accounts-config-file=/data/node4/permissions_config.toml --bootnodes=$$(cat /data/bootnode) $$FLAGS
    networks: { besu: { ipv4_address: 172.30.0.14 } }

networks:
  besu:
    name: janus-besu
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
